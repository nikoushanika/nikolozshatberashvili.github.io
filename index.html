<title>Nikoloz Shatberashvili Portfolio</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Nunito+Sans:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap">
<style>
/* Concept: white studio page. Oversized grotesk headings, numbered sections 01-04, hairline rules, black type only. Layout follows studioschmid.de (numbered sections, one-line hero heading, project blocks with role lists, services rows, stats, contact). */
:root{
  --bg:#FFFFFF; --fg:#000000; --line:rgba(0,0,0,.16); --soft:#F4F4F4;
  --f:"Nunito Sans","Noto Sans Georgian",system-ui,sans-serif; --fh:"Jost","Noto Sans Georgian",system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:17px;line-height:1.5;font-weight:400;padding-left:var(--gl);padding-right:var(--gr);padding-block:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3,.stat b,.job .yr,.ctg .v,.brand{font-family:var(--fh)}
h1,h2,h3{font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.03em}
.sm{font-size:14px;letter-spacing:0}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:0 var(--gr) 0 var(--gl)}
header.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{font-weight:600;text-decoration:none;letter-spacing:-.01em;white-space:nowrap;background:var(--fg);color:var(--bg);padding:4px 10px;font-size:14px;line-height:1.5}
.brand b{font-weight:800}
nav.main{display:flex;gap:26px;margin-left:auto;font-size:15px}
nav.main a{text-decoration:none}
nav.main a:hover,.ul:hover{text-decoration:underline;text-underline-offset:4px}
.lang{display:flex;gap:2px;margin-left:auto;font-size:14px}
nav.main + .lang{margin-left:0}
.lang button{border:0;background:transparent;padding:4px 8px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
@media (max-width:760px){nav.main{display:none}}

.hero{padding-block:72px 40px}
.hero .eyebrow{font-size:15px;margin-bottom:28px}
.hero h1{font-size:clamp(2.6rem,8.2vw,7.4rem);line-height:.98;font-weight:500;letter-spacing:-.04em;max-width:14ch}
.hero .row{display:flex;justify-content:space-between;gap:32px;align-items:flex-end;flex-wrap:wrap;margin-top:36px}
.hero p.lead{font-size:clamp(1.05rem,1.6vw,1.35rem);max-width:44ch;margin:0;line-height:1.35}
.down{font-size:1.05rem;text-decoration:none;border-bottom:1px solid var(--fg);padding-bottom:2px}
.down:hover{background:var(--fg);color:var(--bg)}

.cmp{position:relative;aspect-ratio:16/8;overflow:hidden;background:#fff;border:1px solid var(--line);user-select:none;touch-action:pan-y;--p:50%;margin-top:8px}
.cmp img{position:absolute;inset:0;width:100%;height:100%}
.cmp .rn{object-fit:contain;object-position:50% 40%}
.cmp .sk{object-fit:contain;background:#fff;clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .bar{position:absolute;top:0;bottom:0;left:var(--p);width:1px;background:var(--fg);pointer-events:none}
.cmp .bar::after{content:"↔";position:absolute;top:50%;left:50%;width:40px;height:40px;transform:translate(-50%,-50%);background:var(--fg);color:var(--bg);border-radius:50%;display:grid;place-items:center;font-size:16px}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp .tag{position:absolute;top:12px;padding:2px 10px;background:var(--bg);border:1px solid var(--fg);font-size:13px}
.cmp .tag.a{left:12px}.cmp .tag.b{right:12px}
.cap{font-size:13.5px;margin:12px 0 0;max-width:80ch}
@media (max-width:640px){.cmp{aspect-ratio:4/3}}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 24px;border-top:1px solid var(--fg);margin-top:24px}
.stat{padding:22px 24px 8px 0}
.stat b{font-weight:500;font-size:clamp(2.4rem,4.6vw,4.2rem);line-height:1;letter-spacing:-.05em;display:block;font-variant-numeric:tabular-nums}
.stat b.sm{font-size:clamp(1.7rem,3.1vw,2.9rem);height:clamp(2.4rem,4.6vw,4.2rem);display:flex;align-items:center;letter-spacing:-.03em;white-space:nowrap}
:lang(ka) .stat b.sm{font-size:clamp(1.2rem,2vw,1.85rem);letter-spacing:-.01em}
.stat span{display:block;margin-top:10px;font-size:15px;max-width:30ch}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:minmax(0,1fr)}.stat{padding:18px 0 8px}}

section{padding-block:120px 0}
.sh{margin-bottom:56px;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.sh .top2{display:flex;gap:16px;font-size:15px;border-top:1px solid var(--fg);padding-top:14px}
.sh .top2 .n{min-width:44px}
.sh h2{font-size:clamp(2.4rem,6.4vw,5.6rem);line-height:.98;font-weight:500;letter-spacing:-.045em;max-width:18ch}
.sh p{margin:0;max-width:56ch;font-size:1.1rem;line-height:1.4}

/* contents index */
.toc{margin-top:96px}
.toc .lab{margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* case studies */
.flag{padding-block:44px 28px;border-top:1px solid var(--line)}
.fh{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:start;margin-bottom:28px}
.fh h3{font-size:clamp(2rem,4.6vw,4rem);line-height:1;letter-spacing:-.045em;font-weight:500}
.facts{margin:0;display:grid;gap:0}
.facts div{display:flex;justify-content:flex-end;gap:6px;padding:3px 0;font-size:15px}
.facts dt::after{content:":"}
.facts dt,.facts dd{margin:0}
.facts dd{text-align:right;font-weight:500}
@media (max-width:900px){.fh{grid-template-columns:minmax(0,1fr)}}
/* gallery: justified rows, every image keeps its own proportions (no cropping) */
.gal{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.gal::after{content:"";flex-grow:1000000}
.gal.fill::after{display:none}
.gal button{padding:0;border:0;background:var(--soft);overflow:hidden;display:block;min-width:0;border-radius:14px}
.gal img{display:block;width:100%;height:auto;aspect-ratio:var(--ar);object-fit:contain;transition:transform .6s}
.gal button.plan{background:#fff;border:1px solid var(--line)}
.gal button:hover img{transform:scale(1.02)}
@media(max-width:640px){.gal button{flex-basis:calc(50% - 6px)!important}.gal button.hero1{flex-basis:100%!important}}
.bd{margin:40px 0 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:36px 40px}
@media(max-width:760px){.bd{grid-template-columns:minmax(0,1fr)}}
.bd > div{border-top:1px solid var(--fg);padding-top:12px}
.bd dt{font-size:14px;margin-bottom:8px;font-weight:500}
.bd dd{margin:0;max-width:none;text-align:left;text-wrap:pretty}
.bd > div + div dd{text-align:justify;hyphens:manual}
.tbd{display:block;padding:12px 14px;border:1px dashed var(--fg);background:var(--soft);font-size:14.5px}
@media (prefers-reduced-motion:reduce){.gal img,.card img{transition:none}html{scroll-behavior:auto}}

.dls{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.dlb{font-size:1.05rem;text-decoration:none;border:1px solid var(--fg);padding:8px 16px}
.dlb:hover{background:var(--fg);color:var(--bg)}
.dlmsg{font-size:14px;min-height:1.4em;margin:12px 0 0}
.pn{font-family:var(--f);font-size:15px;font-weight:500;letter-spacing:0;display:block;margin-bottom:12px}
.flag:target,.flag{scroll-margin-top:72px}
/* archive (unused) */
.subh{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;border-top:1px solid var(--fg);padding-top:14px;margin:88px 0 28px}
.subh h3{font-size:clamp(1.6rem,3vw,2.4rem);letter-spacing:-.035em}
.chips{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.chip{border:0;background:transparent;padding:2px 0;border-bottom:1px solid transparent}
.chip:hover{border-bottom-color:var(--fg)}
.chip[aria-pressed="true"]{border-bottom-color:var(--fg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 20px}
.card{text-align:left;background:transparent;border:0;padding:0;display:block}
.card .im{aspect-ratio:4/3;overflow:hidden;background:var(--soft)}
.card img{width:100%;height:100%;object-fit:contain;transition:transform .6s}
.card:hover img{transform:scale(1.04)}
.card h3{font-size:1.2rem;letter-spacing:-.02em;line-height:1.2;margin:12px 0 4px}
.card .m{font-size:14px;display:block}
.card .t{font-size:13px;display:block;margin-top:2px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}

/* approach rows */
.disc{border-top:1px solid var(--fg)}
.disc div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;padding:30px 0;border-bottom:1px solid var(--line)}
.disc h3{font-size:clamp(1.6rem,3.2vw,2.6rem);line-height:1.05;letter-spacing:-.04em}
.disc p{margin:0;max-width:46ch;font-size:1.05rem}
@media (max-width:700px){.disc div{grid-template-columns:minmax(0,1fr);gap:10px}}
.disc{border-top:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.disc div{display:flex;flex-direction:column;gap:16px;padding:26px 24px;border:1px solid var(--pill-b);background:var(--pill-bg);border-radius:28px}
.disc h3{font-size:clamp(1.4rem,2.1vw,1.9rem)}
.disc p{max-width:none;font-size:1rem;line-height:1.45}
@media(max-width:1100px){.disc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.disc{grid-template-columns:minmax(0,1fr)}}

/* career */
.tl{border-top:1px solid var(--fg)}
.job{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.5fr);gap:32px;padding:30px 0;border-bottom:1px solid var(--line)}
.job .yr{font-size:clamp(1.3rem,2.4vw,1.9rem);letter-spacing:-.03em;font-weight:500;font-variant-numeric:tabular-nums}
.job h3{font-size:1.35rem;letter-spacing:-.025em}
.job .org{margin:2px 0 10px;font-weight:500}
.job .pj{display:inline-block;border:1px solid var(--fg);padding:1px 10px;margin-bottom:10px;font-size:13.5px}
.job ul{margin:0;padding-left:18px;max-width:68ch}
.job li{margin:3px 0}
@media (max-width:700px){.job{grid-template-columns:minmax(0,1fr);gap:8px}}
#tl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
#tl .job{grid-template-columns:minmax(0,1fr);gap:10px;padding:26px 28px;border:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:22px;align-content:start}
#tl .job ul{max-width:none}
@media(max-width:900px){#tl{grid-template-columns:minmax(0,1fr)}}


.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:56px;margin-top:8px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr);gap:40px}}
.lab{font-size:14px;font-weight:500;border-top:1px solid var(--fg);padding-top:12px;margin:0 0 6px}
.tools{margin-bottom:8px}
.tool{display:grid;grid-template-columns:minmax(0,1fr) auto 110px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.meter{display:flex;gap:3px}
.meter i{height:6px;flex:1;background:var(--line)}
.meter i.on{background:var(--fg)}
.tool b{font-weight:500}
.ed div{padding:13px 0;border-bottom:1px solid var(--line)}
.ed b{display:block;font-weight:500}
.ed span{font-size:15px}
#langs{display:grid;grid-template-columns:1fr 1fr;column-gap:0}
#langs div:nth-child(even){padding-left:28px}
#langs div:last-child:nth-child(odd){grid-column:1/-1}
.certs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 36px}
.certs button{padding:0;border:1px solid var(--line);background:#fff;text-align:left}
.certs button:hover{border-color:var(--fg)}
.certs span{display:block;padding:8px 10px;font-size:13px;line-height:1.35}
.sp{height:36px}

.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:56px}
.chead h2{margin-bottom:0}
.cph{margin:0;flex:none;width:clamp(170px,24vw,320px);position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1290/1285;background:#eee}
.cph img{width:100%;height:100%;object-fit:contain;display:block;filter:grayscale(1)}
.cph figcaption{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid var(--pill-b);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.chead{display:block;margin-bottom:40px}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:40px}

.ctop .dlb{justify-content:center;text-align:center;white-space:nowrap}
.cint{flex:1;margin:0;max-width:none;font-size:clamp(1rem,1.35vw,1.2rem);line-height:1.5}
.cbody{display:grid;grid-template-columns:minmax(220px,360px) minmax(0,1fr);gap:48px;align-items:stretch}

.cbody .cl{display:flex;flex-direction:column;gap:26px;justify-content:space-between;min-width:0}

.cbody .ctg .k{margin:0}
.cbody .ctg .v{font-size:clamp(1.1rem,2vw,1.7rem);white-space:nowrap;overflow-wrap:normal}

@media(max-width:760px){.ctop{flex-direction:column;gap:20px}.ctop .dls{flex-direction:row;flex-wrap:wrap}.cbody{grid-template-columns:minmax(0,1fr);gap:28px}.cbody .cph{max-width:320px}.cbody .ctg>div{grid-template-columns:minmax(0,1fr) auto}.cbody .ctg .k{grid-column:1/-1}.cbody .ctg .v{white-space:normal;overflow-wrap:anywhere}}
.sh h2.one,.contact h2.one{white-space:nowrap;max-width:none;width:100%;margin-bottom:0}
.contact{padding-block:0 0}

.ctg > div{border-top:1px solid var(--fg);padding-top:12px}

.cp{border:1px solid var(--fg);background:transparent;padding:3px 12px;font-size:13px;margin-top:12px}
.cp:hover{background:var(--fg);color:var(--bg)}
.refs{font-size:14px;margin:28px 0 0}
@media (max-width:700px){.ctg{grid-template-columns:minmax(0,1fr)}}
footer{border-top:1px solid var(--fg);margin-top:96px;padding-block:18px 36px;font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.ov{position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.96);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 40px}

.md{background:var(--bg);width:min(1040px,100%);border:1px solid var(--fg);margin:auto 0}

.hf img{width:100%;height:auto;object-fit:contain;background:var(--soft)}

    return `<article class="flag" id="p-${f.id}"><div class="fh"><div><span class="pn">${String(ix+1).padStart(2,'0')} / ${PROJECTS.length}</span><h3 data-ek="p.${f.id}.name">${t(f.name)}</h3></div><dl class="facts">${facts}</dl></div>${car?`<div class="galw"><div class="gal car">${gal}</div><div class="cnav"><button type="button" data-car="-1" aria-label="Previous">←</button><span class="cc">1 / ${f.imgs.length}</span><button type="button" data-car="1" aria-label="Next">→</button></div></div>`:`<div class="gal">${gal}</div>`}<dl class="bd">${body}</dl></article>`}).join('');
}
function renderToc(){
  $('#tiles').innerHTML=TILES.map(([k,im])=>{const list=PROJECTS.filter(a=>a.rk===k);const n=list.length;const name=t(RTAGS[k]);const ar=AR[im]||1.5;
    return `<button class="tile" data-go="#p-${list[0].id}"><div class="tp"><span class="tc">${n} ${t(n===1?UI.pj1:UI.pjn)}</span><i class="tg" aria-hidden="true">↓</i></div><h3 class="tn">${name}</h3><ul class="tls">${list.map(a=>`<li>${t(a.name)}</li>`).join('')}</ul><div class="im" style="--ar:${ar.toFixed(3)}">${img(im,name)}</div></button>`}).join('');
}
function renderJobs(){
  $('#tl').innerHTML=JOBS.map(j=>`<div class="job"><div class="yr">${j.y}</div><div><h3 data-ek="j.${JOBS.indexOf(j)}.role">${lang==='en'?String(t(j.role)).replace(/ and /g,' &amp; '):t(j.role)}</h3><div class="org">${j.org}</div>${j.pj?`<span class="pj">${j.pj}</span>`:''}<ul>${j.pts.map((p,pi)=>`<li data-ek="j.${JOBS.indexOf(j)}.pt${pi}">${t(p)}</li>`).join('')}</ul></div></div>`).join('');
}
function renderTools(){
  $('#tools').innerHTML=TOOLS.map(([n,l,lv])=>`<div class="tool"><b>${n}</b><span class="sm">${t(LV[lv])}</span><div class="meter" aria-hidden="true">${[1,2,3,4,5].map(i=>`<i class="${i<=l?'on':''}"></i>`).join('')}</div></div>`).join('');
  $('#ed').innerHTML=ED.map(([a,b])=>`<div><b>${t(a)}</b><span>${t(b)}</span></div>`).join('');
  $('#certs').innerHTML=CERTS.map(([k,c])=>`<button data-zoom="${k}" data-title="${esc(t(c))}">${img(k,t(c))}<span>${t(c)}</span></button>`).join('');
  $('#langs').innerHTML=LANGS.map(([a,b])=>`<div><b>${t(a)}</b><span>${t(b)}</span></div>`).join('');
}
function renderAll(){renderStatic();renderStats();renderFlags();renderToc();renderJobs();renderTools();fitGal();fitFull();fitHead();setTimeout(fitCar,0);document.querySelectorAll('img[data-img]').forEach(i=>i.src=IMG[i.dataset.img]||'')}

function openModal(title,html){$('#mt').textContent=title;$('#mb').innerHTML=html;$('#mx').textContent=t(UI.close);$('#ov').hidden=false;document.body.style.overflow='hidden';$('#mx').focus()}
function closeModal(){$('#ov').hidden=true;document.body.style.overflow=''}
$('#mx').onclick=closeModal;
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeModal()});

document.addEventListener('click',e=>{
  const cb=e.target.closest('[data-car]');
  if(cb){const g=cb.closest('.galw').querySelector('.gal');g.scrollBy({left:(+cb.dataset.car)*g.clientWidth*0.9,behavior:'smooth'});return}
  const z=e.target.closest('[data-zoom]');
  if(z){openModal(z.dataset.title||'',`<div class="imgs"><img src="${IMG[z.dataset.zoom]}" alt=""></div>`);return}
  const g=e.target.closest('[data-go]');
  if(g){document.querySelector(g.dataset.go).scrollIntoView({behavior:'smooth'});return}
  const dl=e.target.closest('[data-dl]');
  if(dl){download(e,dl);return}
  const cp=e.target.closest('[data-copy]');
  if(cp){const el=document.getElementById(cp.dataset.copy);const done=()=>{cp.textContent=t(UI.copied);setTimeout(()=>cp.textContent=t(UI.copy),1400)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);done()};
    try{navigator.clipboard.writeText(el.textContent).then(done,sel)}catch(err){sel()}}
});
let toastT;
function toast(m){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=m;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{el.style.display='none'},7000);const d=$('#dlmsg');if(d)d.textContent=m}
async function download(e,a){
  if(!window.claude){a.setAttribute('download',a.dataset.dl==='cv'?'Nikoloz_Shatberashvili_CV.pdf':'Nikoloz_Shatberashvili_Portfolio.pdf');return}
  e.preventDefault();
  const href=a.getAttribute('href');
  const name=a.dataset.dl==='cv'?'Nikoloz_Shatberashvili_CV.pdf':'Nikoloz_Shatberashvili_Portfolio.pdf';
  let d=null;
  try{d=window.claude&&await claude.use('downloads')}catch(x){}
  if(!d){toast(t(UI.dl_na));window.open(href,'_blank');return}
  toast(t(UI.dl_wait));
  let blob;
  try{const r=await fetch(href);if(!r.ok)throw new Error('HTTP '+r.status);blob=await r.blob()}
  catch(x){toast(t(UI.dl_err)+' (fetch: '+(x&&x.message||x)+')');window.open(href,'_blank');return}
  try{await d.save({filename:name,data:blob});toast(t(UI.dl_ok))}
  catch(x){const c=x&&x.code;if(c==='declined')toast(t(UI.dl_no));else toast(t(UI.dl_err)+' ('+(c||'')+' '+(x&&x.message||'')+')')}
}
function setLang(l){lang=l;renderAll();if(typeof fitLead==='function')fitLead();fitHead();fitGal();fitFull();if(editing){setEditable(true);updBar()}const b=$('#edbtn');if(b)b.textContent=t(UI.ed_edit)}

renderAll();

if(IMG.me_port){const mp=$('#meport');if(mp)mp.src=IMG.me_port}
if(IMG.me){const m=$('#me');if(m)m.innerHTML='<img src="'+IMG.me+'" alt="Nikoloz Shatberashvili">'}
/* ===== on-page editor ===== */
const OV=new Map();            /* "lang|key" -> text */
let editing=false,canEdit=false,saveT,dirty=false;
const regGet=(key)=>{const p=key.split('.');
  if(p[0]==='ui')return UI[p[1]];
  if(p[0]==='p'){const f=PROJECTS.find(x=>x.id===p[1]);if(!f)return null;if(p[2]==='name')return f.name;if(!f[p[2]])f[p[2]]=L('','');return f[p[2]]}
  if(p[0]==='j'){const j=JOBS[+p[1]];if(!j)return null;return p[2]==='role'?j.role:j.pts[+p[2].slice(2)]}
  if(p[0]==='s')return (STATS[+p[1]]||{}).t;
  if(p[0]==='d'){const d=DISC[+p[1]];return d&&d[p[2]]}
  return null};
function applyItems(items){(items||[]).forEach(([lg,key,text])=>{const o=regGet(key);if(o&&(lg==='en'||lg==='ka')){o[lg]=text;OV.set(lg+'|'+key,text)}})}
const itemsArr=()=>[...OV].map(([k,v])=>{const i=k.indexOf('|');return [k.slice(0,i),k.slice(i+1),v]});
async function loadEdits(){
  try{const r=await fetch('edits.json');if(r.ok){const j=await r.json();applyItems(j.items)}}catch(e){}
  try{const db=window.claude&&await claude.use('db');if(db){const sn=await db.doc('edits/main').get();if(sn.exists){const d=sn.data();if(d&&Array.isArray(d.items)){OV.clear();applyItems(d.items)}}}}catch(e){}
  if(!editing)renderAll();
}
function status(m){let el=$('#edbar .st');if(el)el.textContent=m}
function scheduleSave(){dirty=true;status(t(UI.ed_unsaved));clearTimeout(saveT);saveT=setTimeout(saveDraft,1500)}
async function saveDraft(){
  try{const db=window.claude&&await claude.use('db');if(!db){status(t(UI.ed_nodb));return}
    await db.doc('edits/main').set({items:itemsArr()});dirty=false;status(t(UI.ed_saved))}
  catch(e){status(t(UI.ed_nodb)+' ('+(e&&e.code||'')+')')}
}
async function publishEdits(){
  await saveDraft();
  try{const a=window.claude&&await claude.use('artifact');if(!a)throw {code:'unavailable'};
    await a.publish({'edits.json':{content:JSON.stringify({items:itemsArr()}),contentType:'application/json'}});
    status(t(UI.ed_pub))}
  catch(e){status(t(UI.ed_nopub)+' ('+(e&&e.code||'')+')')}
}
function setEditable(on){
  document.querySelectorAll('[data-ek]').forEach(el=>{
    const o=regGet(el.dataset.ek);const orig=o?o[lang]:'';
    const ok=on&&o&&!/<[a-z]/i.test(orig||'');
    if(ok){el.contentEditable='plaintext-only';if(el.contentEditable!=='plaintext-only')el.contentEditable='true';el.classList.add('ed')}
    else{el.removeAttribute('contenteditable');el.classList.remove('ed')}
  });
}
function toggleEdit(on){
  editing=on;document.body.classList.toggle('editing',on);
  let bar=$('#edbar');
  if(on){if(!bar){bar=document.createElement('div');bar.id='edbar';document.body.appendChild(bar)}
    bar.innerHTML=`<span class="st"></span><span class="ln"></span><button data-ed="pub"></button><button data-ed="done"></button>`;
    bar.style.display='flex';updBar();setEditable(true)}
  else{if(bar)bar.style.display='none';setEditable(false);const eb=$('#edbtn');if(eb)eb.style.display=canEdit?'block':'none'}
  const eb=$('#edbtn');if(eb)eb.style.display=(canEdit&&!on)?'block':'none';
}
function updBar(){const b=$('#edbar');if(!b)return;b.querySelector('.ln').textContent=t(UI.ed_lang);b.querySelector('[data-ed=pub]').textContent=t(UI.ed_publish);b.querySelector('[data-ed=done]').textContent=t(UI.ed_done);if(!b.querySelector('.st').textContent)status(dirty?t(UI.ed_unsaved):'')}
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-ek].ed');if(el&&el.querySelector('.tbd'))el.textContent=''});
document.addEventListener('focusout',e=>{const el=e.target.closest&&e.target.closest('[data-ek].ed');if(!el)return;
  const key=el.dataset.ek,o=regGet(key);if(!o)return;
  const txt=el.innerText.replace(/ /g,' ').trim();
  if(txt===''){if(!o[lang]){renderAll();setEditable(true)}else{el.textContent=o[lang]}return}
  if(txt!==o[lang]){o[lang]=txt;OV.set(lang+'|'+key,txt);scheduleSave()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest&&e.target.closest('[data-ek].ed')&&!e.target.closest('dd,p,li')){e.preventDefault();e.target.blur()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-ed],#edbtn');if(!b)return;
  if(b.id==='edbtn'){toggleEdit(true);return}
  if(b.dataset.ed==='done'){saveDraft();toggleEdit(false)}
  if(b.dataset.ed==='pub')publishEdits()},true);
document.addEventListener('click',e=>{if(editing&&e.target.closest('[data-ek].ed')){e.stopPropagation();e.preventDefault()}},true);
(async()=>{try{const u=window.claude&&await claude.use('user');if(u&&await u.canEdit()){canEdit=true;
  const b=document.createElement('button');b.id='edbtn';b.textContent=t(UI.ed_edit);document.body.appendChild(b)}}catch(e){}})();
loadEdits();

function carCount(g){const b=[...g.querySelectorAll('button')];const x=g.scrollLeft+2;let i=0;b.forEach((el,k)=>{if(el.offsetLeft-g.offsetLeft<=x+el.offsetWidth/2)i=k});const w=g.closest('.galw'),cc=w&&w.querySelector('.cc');if(cc)cc.textContent=(i+1)+' / '+b.length;const bs=w.querySelectorAll('.cnav button');bs[0].disabled=g.scrollLeft<=2;bs[1].disabled=g.scrollLeft+g.clientWidth>=g.scrollWidth-2}
document.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('car'))carCount(e.target)},true);
function fitCar(){document.querySelectorAll('.gal.car').forEach(carCount)}
addEventListener('resize',fitCar);addEventListener('load',fitCar);
function fitFull(){document.querySelectorAll('.toc .ts,.sh p').forEach(e=>{e.classList.remove('one');e.style.fontSize='';if(innerWidth<760)return;const W=e.clientWidth;const base=parseFloat(getComputedStyle(e).fontSize);const r=document.createRange();r.selectNodeContents(e);const nat=r.getBoundingClientRect().width;const lh=parseFloat(getComputedStyle(e).lineHeight)||base*1.4;if(e.getBoundingClientRect().height>lh*1.6)return;if(nat<W*.55)return;let f=Math.min(base*W/nat,base*1.7);e.style.fontSize=f+'px';e.classList.add('one');if(e.scrollWidth>e.clientWidth+1){f*=.97;e.style.fontSize=f+'px'}})}
addEventListener('resize',fitFull);addEventListener('load',fitFull);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitFull);
function fitGal(){document.querySelectorAll('.gal:not(.car)').forEach(g=>{g.classList.remove('fill');const b=[...g.querySelectorAll('button')];if(b.length<2)return;const top=b[b.length-1].offsetTop;const row=b.filter(x=>Math.abs(x.offsetTop-top)<3);if(row.length===b.length&&b.length<2)return;const gap=parseFloat(getComputedStyle(g).columnGap)||12;const sum=row.reduce((a,x)=>a+(parseFloat(x.style.getPropertyValue('--ar'))||1.5),0);const h=(g.clientWidth-gap*(row.length-1))/sum;if(h<=560)g.classList.add('fill')})}
addEventListener('resize',fitGal);addEventListener('load',fitGal);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitGal);
function fitHead(){document.querySelectorAll('.sh h2,.contact h2').forEach(e=>{e.classList.remove('one');e.style.fontSize='';if(innerWidth<760)return;e.classList.add('one');const W=e.clientWidth;const r=document.createRange();r.selectNodeContents(e);const base=parseFloat(getComputedStyle(e).fontSize);const nat=r.getBoundingClientRect().width;if(!nat)return;let f=Math.min(base*W/nat,88);e.style.fontSize=f+'px';if(e.scrollWidth>e.clientWidth+1){f*=.97;e.style.fontSize=f+'px'}})}
addEventListener('resize',fitHead);addEventListener('load',fitHead);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitHead);
function fitLead(){const e=document.querySelector('.panel .hero p.lead');if(!e)return;e.classList.remove('one');const lh=parseFloat(getComputedStyle(e).lineHeight)||24;if(e.getBoundingClientRect().height<lh*1.6&&innerWidth>=700)e.classList.add('one')}
addEventListener('resize',fitLead);addEventListener('load',fitLead);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitLead);
</script>
